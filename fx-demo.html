<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#101a16"><title>PACK / RUN — attack demo</title><link rel="stylesheet" href="style.css">
<style>
  .inventory-panel, #encounter-controls, #wave-dots { display: none; }
  .app { height: auto; min-height: 0; }
  main { height: auto; }
  .game-layout { grid-template-columns: 1fr !important; height: auto; }
  .run-panel { height: auto; }
  .stage { height: min(520px, 62vh); min-height: 340px; flex: none; }
  .fx-dock {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 4px 0;
  }
  .fx-dock button {
    min-height: 44px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid #344333;
    background: #19251e;
    color: #eff5e6;
    font-weight: 700;
  }
  .fx-dock button.on { border-color: #d1f795; color: #d1f795; }
  .fx-dock button.mythic.on { border-color: #f43f5e; color: #fda4af; }
.fx-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 4px;color:#ecdfbd}.fx-tools select,.fx-tools button{padding:8px;background:#223629;color:#f4e8c2;border:1px solid #526648;border-radius:7px}.fx-timeline{display:flex;align-items:center;gap:8px;flex:1;min-width:240px}.fx-timeline input{flex:1;min-width:60px}#fx-note{width:100%;margin:0;color:#c0c9ab}.app.phone{max-width:390px;margin:auto}.app.phone .stage{height:340px}.fx-dock{padding-bottom:24px}@media(max-width:600px){.stage{height:340px;min-height:300px}}
</style>
<style>
html,body{height:auto;overflow:auto}.app{padding:0 16px 24px}main{height:auto}.game-layout{display:block}.run-panel{display:flex}.stage-top{position:static;height:34px;padding:0 12px;background:#213027}.stage{width:100%}.fx-tools button,.fx-tools select{min-height:44px}.fx-tools input[type=checkbox]{width:20px;height:20px;vertical-align:middle}
.fx-dock button{flex:1 1 150px;font-size:12px}.fx-tools{position:relative;background:#101a16}#app-header{position:static;height:48px}.stage-hud{inset:10px 12px auto}.fx-timeline{min-width:100%}
@media(max-width:700px){.app{padding:0 8px 16px}.stage{height:340px;min-height:260px}.stage-top{padding:0 10px;font-size:12px}.fx-tools{gap:6px;font-size:12px}#fx-note{font-size:11px;line-height:1.5}.fx-dock{gap:6px}.fx-dock button{flex-basis:140px;min-height:48px}}
</style>
</head>
<body><div class="app">
<header id="app-header"><a class="brand" href="./"><span class="brand-mark">↗</span>PACK<span class="slash">/</span>RUN</a><div class="header-actions"><span class="record" hidden>♛ <b id="best">0 m</b></span><button id="fullscreen" class="icon-button" title="Full screen (F)" aria-label="Toggle full screen">⛶</button><button id="sound" class="icon-button" title="Enable sound" aria-label="Enable sound">♫</button><button id="pause" class="icon-button" title="Pause (space)" aria-label="Pause">Ⅱ</button></div></header>
<main><div id="game-layout" class="game-layout">
<section class="run-panel"><div class="stage-top"><b id="biome">Attack demo</b><div id="wave-dots" class="wave-dots" role="img" aria-label="Level waves"></div><span id="run-state"></span></div>
<div class="stage"><canvas id="game" aria-label="Attack demo"></canvas><div class="stage-hud"><div class="bars"><div class="health"><span>♥</span><div><div id="hp-fill"></div></div><b id="hp-text">100</b></div><div class="mana"><span>✦</span><div><div id="mana-fill"></div></div><b id="mana-text">100</b></div></div></div><div id="announcement" class="announcement"></div><div id="overlay" class="overlay"><h2 id="overlay-title">Level 1</h2><p id="overlay-text">Twilight Forest</p><button id="start" class="primary">Play →</button><button id="level-menu-button" class="menu-link">Levels</button><small id="overlay-hint"></small></div></div>
<div id="encounter-controls" class="encounter-controls"><div id="combat-controls" class="combat-controls"><div id="attack-bar" class="attack-bar" role="group" aria-label="Weapon attacks"></div></div><div id="loot-panel" class="loot-panel"><div class="section-label"><b id="loot-heading">On the road</b><span id="loot-count">Tap a find</span></div><div id="loot-tray" class="loot-tray"></div></div></div></section>
<aside class="inventory-panel"><div class="inventory-header"><h2>Backpack <span id="capacity">3 / 25</span></h2><div class="mini-stats" hidden><span>⚡ <b id="power">29</b></span><span>☠ <b id="kills">0</b></span></div></div><div class="bag-area"><div id="inventory" class="inventory" role="group" aria-label="Backpack 5 by 5"></div></div><div class="inventory-actions"><div id="item-detail" class="item-detail">Tap an item</div><button id="rotate" class="icon-button" aria-label="Rotate item" title="Rotate (R)">↻</button><button id="discard" class="icon-button danger" aria-label="Discard item" title="Discard">×</button></div><div class="bottom-actions"><button id="continue" class="primary" disabled>Continue ⚔</button></div><div id="loot-help" class="hint">Drag two matching onto each other</div></aside>
</div>
<div class="fx-dock" id="fx-dock"></div>
<section id="level-select" class="level-select" role="dialog" aria-modal="true" aria-label="Level select" hidden><div class="levels-header"><h2>Levels</h2><button id="levels-close" class="icon-button" aria-label="Close levels">×</button></div><div class="levels-pagination"><button id="levels-prev" class="icon-button" aria-label="Previous 10 levels">‹</button><div><b id="levels-world">Forest Paths</b><span id="levels-range">1–10 / 100</span></div><button id="levels-next" class="icon-button" aria-label="Next 10 levels">›</button></div><div id="level-cards" class="level-cards"></div><button id="levels-play" class="primary">Play · 1</button></section>
</main></div><div id="toast" role="status"></div>
<script src="assets-manifest.js?v=20260923feel3"></script>
<script src="assets-loader.js?v=20260923feel3"></script>
<script src="core.js?v=20260923feel3"></script>
<script src="weapon-icons.js?v=20260923feel3"></script>
<script src="attack-fx.js?v=20260923feel3"></script>
<script src="campaign.js?v=20260923feel3"></script>
<script src="fx-atlas-data.js?v=20260923feel3"></script>
<script src="combat.js?v=20260923feel3"></script>
<script src="frog-regions.js?v=20260923feel3"></script>
<script src="frog.js?v=20260923feel3"></script>
<script src="chest.js?v=20260923feel3"></script>
<script src="game.js?v=20260923feel3"></script>
<script src="fx-demo.js?v=20260923feel3"></script>
</body></html>
