<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PACK / RUN — Arsenal of 52 Weapon Icons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070d0b;
      --panel: #0e1714;
      --card-bg: #14211d;
      --card-hover: #1c2e28;
      --border: #22372e;
      --accent: #34d399;
      --accent-warm: #f59e0b;
      --text: #f0fdf4;
      --text-muted: #859e94;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      padding: 24px;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-family: 'Cinzel', serif;
      font-size: 32px;
      font-weight: 900;
      color: var(--accent-warm);
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
    }
    .header p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 6px;
    }

    /* FILTERS */
    .filter-section {
      max-width: 1200px;
      margin: 0 auto 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      width: 65px;
    }
    .filter-chip {
      background: #14201b;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-chip:hover {
      background: #1d3029;
      color: #fff;
    }
    .filter-chip.active {
      background: #234237;
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.25);
    }
    .search-bar {
      width: 100%;
      background: #09120f;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 8px 14px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    .search-bar:focus {
      border-color: var(--accent);
    }

    /* GRID */
    .icons-grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .icon-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .icon-card:hover {
      background: var(--card-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }
    .icon-box {
      width: 64px;
      height: 64px;
      min-width: 64px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1714;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
    }
    .icon-box svg,
    .icon-box img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6));
      transition: transform 0.2s ease;
    }
    .icon-card:hover .icon-box svg,
    .icon-card:hover .icon-box img {
      transform: scale(1.1);
    }
    .card-info {
      flex: 1;
      min-width: 0;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0 6px;
    }
    .badge-rarity {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid;
    }
    .badge-school {
      font-size: 10px;
      color: var(--text-muted);
    }
    .card-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .stats-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      font-size: 10px;
      color: #cbd5e1;
    }
    .stats-row span {
      background: #09120f;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #1c2b25;
    }

    /* MODAL FOR PREVIEW & COPY */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: #101c18;
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      position: relative;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }
    .modal-icon-box {
      width: 120px;
      height: 120px;
      margin: 0 auto 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09120f;
      border: 2px solid;
    }
    .modal-icon-box svg,
    .modal-icon-box img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.7));
    }
    .modal-title {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
    }
    .modal-meta {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 8px 0 16px;
    }
    .modal-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
      background: #08100d;
      padding: 12px;
      border-radius: 8px;
      text-align: left;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-action {
      background: var(--accent);
      color: #052e16;
      border: none;
      text-decoration: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-action:hover {
      background: #6ee7b7;
      transform: scale(1.02);
    }
    .btn-action.blue {
      background: #0ea5e9;
      color: #032b42;
    }
    .btn-action.blue:hover {
      background: #38bdf8;
    }
    .btn-action.secondary {
      background: #1e332a;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-action.secondary:hover {
      background: #284438;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>PACK / RUN — 52 Weapon Icons</h1>
    <p>Authentic Storybook Hand-Drawn PNG Images & WebP Atlas matching Twilight Forest & Frog character style.</p>
  </div>

  <div class="filter-section">
    <div class="filter-row">
      <span class="filter-label">RARITY:</span>
      <button class="filter-chip active" data-filter-rarity="all">All (52)</button>
      <button class="filter-chip" data-filter-rarity="common">Common</button>
      <button class="filter-chip" data-filter-rarity="uncommon">Uncommon</button>
      <button class="filter-chip" data-filter-rarity="rare">Rare</button>
      <button class="filter-chip" data-filter-rarity="epic">Epic</button>
      <button class="filter-chip" data-filter-rarity="legendary">Legendary</button>
      <button class="filter-chip" data-filter-rarity="mythic">Mythic</button>
    </div>
    <div class="filter-row">
      <span class="filter-label">SCHOOL:</span>
      <button class="filter-chip active" data-filter-school="all">All Schools</button>
      <button class="filter-chip" data-filter-school="magic">Elemental Magic</button>
      <button class="filter-chip" data-filter-school="heavy">Heavy Weapons</button>
      <button class="filter-chip" data-filter-school="blades">Blades & Swords</button>
      <button class="filter-chip" data-filter-school="ranged">Ranged</button>
      <button class="filter-chip" data-filter-school="polearms">Polearms</button>
      <button class="filter-chip" data-filter-school="relics">Relics & Alchemy</button>
    </div>
    <input type="text" class="search-bar" id="searchInput" placeholder="Search icons by weapon name, school or property...">
  </div>

  <div class="icons-grid" id="iconsGrid"></div>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-icon-box" id="modalIconBox"></div>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-actions">
        <a class="btn-action blue" id="btnOpenPng" target="_blank">Open Full PNG</a>
        <a class="btn-action" id="btnDownloadPng" download>Download PNG</a>
        <button class="btn-action secondary" id="btnCopySvg">Copy Vector SVG</button>
      </div>
    </div>
  </div>

  <script src="core.js"></script>
  <script src="weapon-icons.js"></script>
  <script>
    const RARITIES = PackCore.RARITIES;
    const SCHOOLS = PackCore.SCHOOLS;
    const TYPES = PackCore.TYPES;

    let filterRarity = 'all';
    let filterSchool = 'all';
    let searchQuery = '';
    let selectedWeapon = null;

    const WEAPONS = Object.keys(TYPES)
      .filter(id => !TYPES[id].gear)
      .map(id => {
        const def = TYPES[id];
        return {
          id,
          name: def.name,
          rarity: def.rarity,
          rarityObj: RARITIES[def.rarity] || RARITIES.common,
          school: def.school || 'magic',
          schoolObj: SCHOOLS[def.school] || SCHOOLS.magic,
          w: def.w,
          h: def.h,
          color: def.color,
          damage: def.damage,
          cooldown: def.cooldown,
          manaCost: def.manaCost,
          desc: (def.descriptions && def.descriptions[0]) || ''
        };
      });

    const iconsGrid = document.getElementById('iconsGrid');
    const searchInput = document.getElementById('searchInput');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalClose = document.getElementById('modalClose');
    const modalIconBox = document.getElementById('modalIconBox');
    const modalTitle = document.getElementById('modalTitle');
    const modalMeta = document.getElementById('modalMeta');
    const modalDesc = document.getElementById('modalDesc');
    const btnCopySvg = document.getElementById('btnCopySvg');

    function render() {
      iconsGrid.innerHTML = '';
      const filtered = WEAPONS.filter(w => {
        if (filterRarity !== 'all' && w.rarity !== filterRarity) return false;
        if (filterSchool !== 'all' && w.school !== filterSchool) return false;
        if (searchQuery && !w.name.toLowerCase().includes(searchQuery) && !w.desc.toLowerCase().includes(searchQuery)) return false;
        return true;
      });

      filtered.forEach(w => {
        const card = document.createElement('div');
        card.className = 'icon-card';
        card.style.borderLeft = `4px solid ${w.rarityObj.color}`;
        card.onclick = () => openModal(w);

        const imgHtml = `<img src="assets/icons/${w.id}.png" width="52" height="52" alt="${w.name}" onerror="this.outerHTML=WeaponIcons.getWeaponIconSvg('${w.id}',{size:52})" />`;

        card.innerHTML = `
          <div class="icon-box" style="border-color:${w.rarityObj.color}44; background: radial-gradient(circle, ${w.rarityObj.color}22 0%, #0d1714 80%);">
            ${imgHtml}
          </div>
          <div class="card-info">
            <div class="card-title">${w.name}</div>
            <div class="card-badges">
              <span class="badge-rarity" style="color:${w.rarityObj.color}; border-color:${w.rarityObj.color}66; background:${w.rarityObj.bg || 'transparent'}">${w.rarityObj.name}</span>
              <span class="badge-school">${w.schoolObj.name}</span>
            </div>
            <div class="card-desc">${w.desc}</div>
            <div class="stats-row">
              <span>⚔ ${w.damage}</span>
              <span>⏱ ${w.cooldown}s</span>
              <span>✦ ${w.manaCost}</span>
              <span>⊞ ${w.w}×${w.h}</span>
            </div>
          </div>
        `;
        iconsGrid.appendChild(card);
      });
    }

    function openModal(w) {
      selectedWeapon = w;
      modalIconBox.style.borderColor = w.rarityObj.color;
      modalIconBox.style.background = `radial-gradient(circle, ${w.rarityObj.color}33 0%, #09120f 80%)`;
      modalIconBox.style.boxShadow = `0 0 24px ${w.rarityObj.color}55`;
      modalIconBox.innerHTML = `<img src="assets/icons/${w.id}.png" width="96" height="96" alt="${w.name}" onerror="this.outerHTML=WeaponIcons.getWeaponIconSvg('${w.id}',{size:96})" />`;

      const btnOpenPng = document.getElementById('btnOpenPng');
      const btnDownloadPng = document.getElementById('btnDownloadPng');
      btnOpenPng.href = `assets/icons/${w.id}.png`;
      btnDownloadPng.href = `assets/icons/${w.id}.png`;
      btnDownloadPng.setAttribute('download', `${w.id}.png`);

      modalTitle.textContent = w.name;
      modalMeta.innerHTML = `
        <span class="badge-rarity" style="color:${w.rarityObj.color}; border-color:${w.rarityObj.color}; background:${w.rarityObj.bg}; padding: 3px 8px;">${w.rarityObj.name}</span>
        <span style="background:#172c23; color:var(--accent); padding:3px 8px; border-radius:4px; font-size:11px;">${w.schoolObj.name}</span>
        <span style="background:#131c18; color:#cbd5e1; padding:3px 8px; border-radius:4px; font-size:11px;">Grid: ${w.w}×${w.h}</span>
        <span style="background:#1e293b; color:#38bdf8; padding:3px 8px; border-radius:4px; font-size:11px;">PNG 256×256</span>
      `;
      modalDesc.innerHTML = `
        <div style="font-weight:700; color:#fff; margin-bottom:4px;">Weapon Tier Effects:</div>
        ${TYPES[w.id].descriptions.map((d, i) => `<div style="margin-top:4px;"><b style="color:${w.rarityObj.color}">★ Tier ${i+1}:</b> ${d}</div>`).join('')}
      `;
      modalBackdrop.classList.add('show');
    }

    modalClose.onclick = () => modalBackdrop.classList.remove('show');
    modalBackdrop.onclick = e => { if (e.target === modalBackdrop) modalBackdrop.classList.remove('show'); };

    btnCopySvg.onclick = () => {
      if (!selectedWeapon) return;
      const svg = WeaponIcons.getWeaponIconSvg(selectedWeapon.id, { size: 64 });
      navigator.clipboard.writeText(svg).then(() => {
        btnCopySvg.textContent = 'Copied to Clipboard!';
        setTimeout(() => { btnCopySvg.textContent = 'Copy Vector SVG'; }, 2000);
      });
    };

    // Filter Listeners
    document.querySelectorAll('[data-filter-rarity]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('[data-filter-rarity]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterRarity = btn.dataset.filterRarity;
        render();
      };
    });

    document.querySelectorAll('[data-filter-school]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('[data-filter-school]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterSchool = btn.dataset.filterSchool;
        render();
      };
    });

    searchInput.oninput = e => {
      searchQuery = e.target.value.toLowerCase().trim();
      render();
    };

    render();
  </script>
</body>
</html>
