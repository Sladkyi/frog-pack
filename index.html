<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#101a16"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Frog Pack"><meta name="format-detection" content="telephone=no"><title>Frog Pack</title><link rel="stylesheet" href="style.css?v=20260923p"></head>
<body><div id="boot" class="boot" role="status" aria-live="polite"><b id="boot-title">Frog Pack</b><div class="boot-track" aria-hidden="true"><span id="boot-fill"></span></div></div><div class="app">
<header id="app-header"><a class="brand" href="./"><span class="brand-mark">↗</span><span class="brand-name">Frog Pack</span></a><div class="header-actions"><span class="record" hidden>♛ <b id="best">0 m</b></span><button id="fullscreen" class="icon-button" title="Full screen (F)" aria-label="Toggle full screen">⛶</button><button id="sound" class="icon-button" title="Enable sound" aria-label="Enable sound">♫</button><button id="pause" class="icon-button" title="Pause (space)" aria-label="Pause">Ⅱ</button></div></header>
<main><div id="game-layout" class="game-layout">
<section class="run-panel"><div class="stage-top"><b id="biome">Level 1</b><div id="wave-dots" class="wave-dots" role="img" aria-label="Level waves"></div><span id="run-state"></span></div>
<div class="stage"><canvas id="game" aria-label="Combat: press weapon buttons"></canvas><div class="stage-hud"><div class="bars"><div class="health"><span>♥</span><div><div id="hp-fill"></div></div><b id="hp-text">100</b></div><div class="mana"><span>✦</span><div><div id="mana-fill"></div></div><b id="mana-text">100</b></div></div></div><div id="announcement" class="announcement"></div><div id="overlay" class="overlay is-menu"><h2 id="overlay-title">Frog Pack</h2><p id="overlay-text">Level 1</p><button id="start" class="primary">PLAY <span>→</span></button><button id="level-menu-button" class="menu-link">All 100</button><small id="overlay-hint">Sort the bag. Or the frog dies.</small></div></div>
<div id="encounter-controls" class="encounter-controls"><div id="combat-controls" class="combat-controls"><div id="attack-bar" class="attack-bar" role="group" aria-label="Weapon attacks"></div></div><div id="loot-panel" class="loot-panel"><div class="section-label"><b id="loot-heading">On the road</b><span id="loot-count">Tap a find</span></div><div id="loot-tray" class="loot-tray"></div></div></div></section>
<aside class="inventory-panel"><div class="inventory-header"><h2>Backpack <span id="capacity">3 / 25</span></h2><div class="mini-stats" hidden><span>⚡ <b id="power">29</b></span><span>☠ <b id="kills">0</b></span></div></div><div class="bag-area"><div id="inventory" class="inventory" role="group" aria-label="Backpack 5 by 5"></div></div><div class="inventory-actions"><div id="item-detail" class="item-detail">Tap an item</div><button id="rotate" class="icon-button" aria-label="Rotate item" title="Rotate (R)">↻</button><button id="discard" class="icon-button danger" aria-label="Discard item" title="Discard">×</button></div><div class="bottom-actions"><button id="continue" class="primary" disabled>Continue ⚔</button></div><div id="loot-help" class="hint">Drag two matching onto each other</div></aside>
</div>
<section id="level-select" class="level-select" role="dialog" aria-modal="true" aria-label="Level select" hidden><div class="levels-header"><h2>Which one kills you?</h2><button id="levels-close" class="icon-button" aria-label="Close levels">×</button></div><div class="levels-pagination"><button id="levels-prev" class="icon-button" aria-label="Previous 10 levels">‹</button><div><b id="levels-world">They look cute</b><span id="levels-range">1–10 / 100</span></div><button id="levels-next" class="icon-button" aria-label="Next 10 levels">›</button></div><div id="level-cards" class="level-cards"></div><button id="levels-play" class="primary">TRY · 1</button></section>
